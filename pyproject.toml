[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-studio"
version = "1.0.0"
description = "Local-first CV designer: 30 original templates, PDF and editable Word (DOCX) export"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["cv", "resume", "pdf", "docx", "pyside6", "desktop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business",
]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.9,<7", "reportlab>=4.4,<5", "python-docx>=1.2,<2", "Pillow>=11,<14"]

[project.scripts]
cv-studio = "cvstudio.gui:run"

[tool.setuptools.package-data]
cvstudio = ["assets/*.svg", "assets/*.ico", "assets/fonts/*.ttf", "assets/fonts/licenses/*.txt"]

[tool.setuptools.packages.find]
include = ["cvstudio*"]
