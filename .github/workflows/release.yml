name: Release (Windows)

# Push a tag such as v1.0.0 to build the Windows app and attach it to a GitHub Release.
# "Run workflow" (manual) builds the same zip as a downloadable artifact without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build (PyInstaller, one-folder)
        run: python -m PyInstaller --noconfirm --clean "CV Studio.spec"
      - name: Zip
        shell: pwsh
        run: |
          $name = "CVStudio-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path dist/CVStudio/* -DestinationPath $name
          "ASSET=$name" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: CVStudio-windows
          path: ${{ env.ASSET }}
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
